<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>하자 사진 선별 툴 — 제로하자</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', -apple-system, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    min-height: 100vh;
  }
  header {
    background: #1e293b;
    border-bottom: 1px solid #334155;
    padding: 16px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  header h1 { font-size: 18px; font-weight: 700; color: #f1f5f9; }
  header span { font-size: 13px; color: #94a3b8; }

  .toolbar {
    padding: 20px 24px;
    background: #1e293b;
    border-bottom: 1px solid #334155;
    display: flex;
    align-items: flex-end;
    gap: 16px;
    flex-wrap: wrap;
  }
  .field { display: flex; flex-direction: column; gap: 6px; }
  label { font-size: 12px; font-weight: 600; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }
  select {
    background: #0f172a;
    border: 1px solid #334155;
    color: #e2e8f0;
    padding: 9px 12px;
    border-radius: 6px;
    font-size: 14px;
    min-width: 180px;
    cursor: pointer;
    outline: none;
  }
  select:focus { border-color: #c9a84c; }
  .field-limit input {
    background: #0f172a;
    border: 1px solid #334155;
    color: #e2e8f0;
    padding: 9px 12px;
    border-radius: 6px;
    font-size: 14px;
    width: 80px;
    outline: none;
  }
  .btn {
    padding: 9px 20px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: opacity 0.15s;
  }
  .btn:hover { opacity: 0.85; }
  .btn-refresh { background: #334155; color: #e2e8f0; }

  .stats {
    padding: 12px 24px;
    font-size: 13px;
    color: #64748b;
    border-bottom: 1px solid #1e293b;
  }
  .stats strong { color: #94a3b8; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 12px;
    padding: 20px 24px 80px;
  }
  .card {
    background: #1e293b;
    border-radius: 10px;
    overflow: hidden;
    border: 2px solid transparent;
    transition: border-color 0.15s, transform 0.15s;
    position: relative;
  }
  .card:hover { transform: translateY(-2px); border-color: #475569; }
  .card.selected { border-color: #c9a84c; }

  .card-thumb {
    width: 100%;
    height: 180px;
    object-fit: cover;
    display: block;
    background: #0f172a;
    cursor: zoom-in;
  }

  .card-meta {
    padding: 9px 12px 4px;
    font-size: 12px;
    color: #64748b;
    line-height: 1.6;
    border-bottom: 1px solid #0f172a;
  }
  .card-meta strong { color: #94a3b8; font-weight: 600; }

  .card-info {
    padding: 8px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .card-tags { display: flex; gap: 4px; flex-wrap: wrap; }
  .tag {
    font-size: 11px;
    padding: 2px 7px;
    border-radius: 20px;
    font-weight: 600;
  }
  .tag-closeup { background: #1e3a5f; color: #60a5fa; }
  .tag-distance { background: #1f3a2e; color: #4ade80; }
  .tag-other { background: #2d2218; color: #fb923c; }
  .tag-space { background: #1e293b; color: #94a3b8; border: 1px solid #334155; }

  .card-dl {
    background: #334155;
    border: none;
    color: #94a3b8;
    padding: 5px 10px;
    border-radius: 5px;
    font-size: 12px;
    cursor: pointer;
    text-decoration: none;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .card-dl:hover { background: #c9a84c; color: #0f172a; }

  .card-check {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: #c9a84c;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    color: #0f172a;
    font-weight: 700;
    pointer-events: none;
  }
  .card.selected .card-check { display: flex; }

  /* 라이트박스 */
  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.94);
    z-index: 1000;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: zoom-out;
  }
  .lightbox.open { display: flex; }
  .lightbox img {
    max-width: 94vw;
    max-height: 82vh;
    object-fit: contain;
    border-radius: 6px;
    box-shadow: 0 8px 60px rgba(0,0,0,0.7);
  }
  .lightbox-meta {
    margin-top: 16px;
    text-align: center;
    font-size: 13px;
    color: #94a3b8;
    line-height: 1.8;
    pointer-events: none;
  }
  .lightbox-meta strong { color: #e2e8f0; }
  .lightbox-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(255,255,255,0.08);
    border: none;
    color: #e2e8f0;
    font-size: 28px;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .lightbox-nav:hover { background: rgba(255,255,255,0.18); }
  .lightbox-prev { left: 16px; }
  .lightbox-next { right: 16px; }
  .lightbox-close {
    position: absolute;
    top: 16px;
    right: 16px;
    background: rgba(255,255,255,0.08);
    border: none;
    color: #e2e8f0;
    font-size: 20px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .lightbox-close:hover { background: rgba(255,255,255,0.2); }
  .lightbox-counter {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 13px;
    color: #64748b;
  }

  .selection-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: #1e293b;
    border-top: 1px solid #334155;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    transform: translateY(100%);
    transition: transform 0.2s;
    z-index: 100;
  }
  .selection-bar.visible { transform: translateY(0); }
  .selection-info { font-size: 14px; color: #94a3b8; }
  .selection-info strong { color: #c9a84c; }
  .selection-actions { display: flex; gap: 8px; }
  .btn-download-all { background: #c9a84c; color: #0f172a; padding: 8px 18px; }
  .btn-clear { background: #334155; color: #94a3b8; padding: 8px 14px; }

  .empty { grid-column: 1/-1; text-align: center; padding: 60px 20px; color: #475569; }
  .empty .icon { font-size: 48px; margin-bottom: 12px; }
  .empty p { font-size: 14px; }
  .loading { grid-column: 1/-1; text-align: center; padding: 60px; color: #64748b; font-size: 14px; }
</style>
</head>
<body>

<header>
  <span style="font-size:20px">🔍</span>
  <div>
    <h1>하자 사진 선별 툴</h1>
    <span>공종·하자유형 선택 → 사진 검색 → 이미지 클릭 = 전체화면 / 카드 클릭 = 선택</span>
  </div>
</header>

<div class="toolbar">
  <div class="field">
    <label>공종</label>
    <select id="sel-construction" onchange="onConstructionChange()">
      <option value="">-- 공종 선택 --</option>
    </select>
  </div>
  <div class="field">
    <label>하자유형</label>
    <select id="sel-defect" onchange="onDefectChange()" disabled>
      <option value="">-- 하자유형 선택 --</option>
    </select>
  </div>
  <div class="field field-limit">
    <label>최대 장수</label>
    <input type="number" id="inp-limit" value="30" min="5" max="100" />
  </div>
  <button class="btn btn-refresh" onclick="refreshPhotos()" id="btn-refresh" style="display:none">🔄 새로고침</button>
</div>

<div class="stats" id="stats" style="display:none"></div>

<div class="grid" id="grid">
  <div class="empty">
    <div class="icon">📷</div>
    <p>공종과 하자유형을 선택하면 사진이 나타납니다.</p>
  </div>
</div>

<!-- 라이트박스 -->
<div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
  <button class="lightbox-close" onclick="closeLightboxDirect()">✕</button>
  <span class="lightbox-counter" id="lb-counter"></span>
  <button class="lightbox-nav lightbox-prev" onclick="lbNav(-1, event)">‹</button>
  <img id="lb-img" src="" alt="">
  <div class="lightbox-meta" id="lb-meta"></div>
  <button class="lightbox-nav lightbox-next" onclick="lbNav(1, event)">›</button>
</div>

<div class="selection-bar" id="sel-bar">
  <div class="selection-info"><strong id="sel-count">0</strong>장 선택됨</div>
  <div class="selection-actions">
    <button class="btn btn-clear" onclick="clearSelection()">선택 해제</button>
    <button class="btn btn-download-all" onclick="downloadSelected()">⬇ 선택 다운로드</button>
  </div>
</div>

<script>
const API = 'https://admin-api.zerohaza.co.kr/api';
let labelsData = [];
let photosData = [];
let selected = new Set();
let currentConstruction = '';
let currentDefect = '';
let lbIndex = 0;

async function init() {
  try {
    const res = await fetch(`${API}/defect-photos/labels`);
    const json = await res.json();
    labelsData = json.data || json;
    const sel = document.getElementById('sel-construction');
    labelsData.forEach(item => {
      const opt = document.createElement('option');
      opt.value = item.construction;
      opt.textContent = `${item.construction} (${item.defects.length}종)`;
      sel.appendChild(opt);
    });
  } catch(e) {
    alert('API 연결 실패: ' + e.message);
  }
}

function onConstructionChange() {
  const construction = document.getElementById('sel-construction').value;
  const defectSel = document.getElementById('sel-defect');
  defectSel.innerHTML = '<option value="">-- 하자유형 선택 --</option>';
  document.getElementById('btn-refresh').style.display = 'none';
  if (!construction) { defectSel.disabled = true; resetGrid(); return; }
  const item = labelsData.find(d => d.construction === construction);
  if (item) {
    item.defects.forEach(defect => {
      const opt = document.createElement('option');
      opt.value = defect;
      opt.textContent = defect;
      defectSel.appendChild(opt);
    });
  }
  defectSel.disabled = false;
  resetGrid();
}

function onDefectChange() {
  const defect = document.getElementById('sel-defect').value;
  if (defect) { document.getElementById('btn-refresh').style.display = ''; loadPhotos(); }
  else { document.getElementById('btn-refresh').style.display = 'none'; resetGrid(); }
}

function refreshPhotos() { loadPhotos(); }

async function loadPhotos() {
  const construction = document.getElementById('sel-construction').value;
  const defect = document.getElementById('sel-defect').value;
  const limit = parseInt(document.getElementById('inp-limit').value) || 30;
  if (!construction || !defect) return;

  currentConstruction = construction;
  currentDefect = defect;
  selected.clear();
  photosData = [];
  updateSelectionBar();

  const grid = document.getElementById('grid');
  grid.innerHTML = '<div class="loading">사진 불러오는 중...</div>';
  document.getElementById('stats').style.display = 'none';

  try {
    const params = new URLSearchParams({ construction, defect, limit });
    const res = await fetch(`${API}/defect-photos?${params}`);
    const json = await res.json();
    photosData = json.data || json;

    const statsEl = document.getElementById('stats');
    statsEl.style.display = 'block';
    statsEl.innerHTML = `<strong>${construction} > ${defect}</strong> — ${photosData.length}장 조회됨 (랜덤 순서)`;

    if (!photosData.length) {
      grid.innerHTML = '<div class="empty"><div class="icon">🚫</div><p>해당 조건의 사진이 없습니다.</p></div>';
      return;
    }

    grid.innerHTML = '';
    photosData.forEach((photo, i) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.url = photo.url;

      const ftClass = photo.fileType === 'closeup' ? 'tag-closeup' : photo.fileType === 'distance' ? 'tag-distance' : 'tag-other';
      const ftLabel = photo.fileType === 'closeup' ? '근거리' : photo.fileType === 'distance' ? '원거리' : photo.fileType || '기타';
      const fname = `${construction}-${defect}-${String(i+1).padStart(2,'0')}.jpg`;

      card.innerHTML = `
        <img class="card-thumb" src="${photo.url}" loading="lazy" alt="${defect}"
          onerror="this.style.opacity='0.2'"
          onclick="event.stopPropagation(); openLightbox(${i})">
        <div class="card-meta">
          <strong>${photo.apartment || '—'}</strong><br>
          ${photo.date || '—'} · ${photo.inspector || '미배정'} · ${photo.space || '—'}
        </div>
        <div class="card-info">
          <div class="card-tags">
            <span class="tag ${ftClass}">${ftLabel}</span>
          </div>
          <a class="card-dl" href="${photo.url}" download="${fname}" target="_blank" onclick="event.stopPropagation()">저장</a>
        </div>
        <div class="card-check">✓</div>
      `;
      card.addEventListener('click', () => toggleSelect(card, photo.url));
      grid.appendChild(card);
    });
  } catch(e) {
    grid.innerHTML = `<div class="empty"><div class="icon">⚠️</div><p>오류: ${e.message}</p></div>`;
  }
}

/* 라이트박스 */
function openLightbox(idx) {
  lbIndex = idx;
  renderLightbox();
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function renderLightbox() {
  const photo = photosData[lbIndex];
  document.getElementById('lb-img').src = photo.url;
  document.getElementById('lb-counter').textContent = `${lbIndex + 1} / ${photosData.length}`;
  document.getElementById('lb-meta').innerHTML =
    `<strong>${photo.apartment || '—'}</strong> &nbsp;·&nbsp; ${photo.space || '—'}<br>` +
    `${photo.date || '—'} &nbsp;·&nbsp; 점검자: ${photo.inspector || '미배정'}`;
}

function closeLightbox(e) {
  if (e.target === document.getElementById('lightbox') || e.target === document.getElementById('lb-img')) {
    closeLightboxDirect();
  }
}

function closeLightboxDirect() {
  document.getElementById('lightbox').classList.remove('open');
  document.body.style.overflow = '';
}

function lbNav(dir, e) {
  e.stopPropagation();
  lbIndex = (lbIndex + dir + photosData.length) % photosData.length;
  renderLightbox();
}

document.addEventListener('keydown', e => {
  if (!document.getElementById('lightbox').classList.contains('open')) return;
  if (e.key === 'Escape') closeLightboxDirect();
  if (e.key === 'ArrowRight') { lbIndex = (lbIndex + 1) % photosData.length; renderLightbox(); }
  if (e.key === 'ArrowLeft') { lbIndex = (lbIndex - 1 + photosData.length) % photosData.length; renderLightbox(); }
});

/* 선택 */
function toggleSelect(card, url) {
  if (selected.has(url)) { selected.delete(url); card.classList.remove('selected'); }
  else { selected.add(url); card.classList.add('selected'); }
  updateSelectionBar();
}

function updateSelectionBar() {
  document.getElementById('sel-count').textContent = selected.size;
  document.getElementById('sel-bar').classList.toggle('visible', selected.size > 0);
}

function clearSelection() {
  selected.clear();
  document.querySelectorAll('.card.selected').forEach(c => c.classList.remove('selected'));
  updateSelectionBar();
}

async function downloadSelected() {
  const urls = Array.from(selected);
  for (let i = 0; i < urls.length; i++) {
    const fname = `${currentConstruction}-${currentDefect}-sel${String(i+1).padStart(2,'0')}.jpg`;
    const a = document.createElement('a');
    a.href = urls[i]; a.download = fname; a.target = '_blank';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    await new Promise(r => setTimeout(r, 300));
  }
}

function resetGrid() {
  selected.clear(); photosData = []; updateSelectionBar();
  document.getElementById('grid').innerHTML = '<div class="empty"><div class="icon">📷</div><p>공종과 하자유형을 선택하면 사진이 나타납니다.</p></div>';
  document.getElementById('stats').style.display = 'none';
}

init();
</script>
</body>
</html>
