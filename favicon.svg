<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#2A7172"/>
  <!-- 왼쪽 핑크 빌딩 (높은 것) -->
  <rect x="5" y="7" width="7" height="18" rx="1" fill="#F0857A"/>
  <!-- 오른쪽 흰 빌딩 (낮은 것) -->
  <rect x="14" y="12" width="7" height="13" rx="1" fill="#ffffff" opacity="0.95"/>
  <!-- 작은 포인트 빌딩 -->
  <rect x="23" y="10" width="4" height="15" rx="1" fill="#A8D5D5"/>
  <!-- 지면 라인 -->
  <rect x="4" y="25" width="24" height="1.5" rx="0.75" fill="#ffffff" opacity="0.4"/>
</svg>
